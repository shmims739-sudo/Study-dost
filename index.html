<div style="text-align: center; margin: 15px 0;">

    <!-- Official Start.io Web Ad Container (Empty container populated by Start.io SDK) -->
    <div id="startapp-ad-container"></div>

    <!-- StartApp Integration -->
    <script type="text/javascript">
      var startAppParam = {
        appId: "209789534"
      };
    </script>
    <script type="text/javascript" src="https://www.startapp.com/js/startapp-3.0.0.js"></script>
    <script type="text/javascript">
      // Official Start.io JavaScript SDK Call to fetch and display actual live ads
      (function() {
        function fetchAndDisplayStartAppAd() {
          var containerId = 'startapp-ad-container';
          var container = document.getElementById(containerId);
          if (!container) return;

          try {
            if (typeof window.StartApp !== 'undefined') {
              if (typeof window.StartApp.init === 'function') {
                window.StartApp.init(startAppParam);
              }
              if (typeof window.StartApp.showBanner === 'function') {
                window.StartApp.showBanner(containerId);
              } else if (typeof window.StartApp.loadBanner === 'function') {
                window.StartApp.loadBanner(containerId);
              } else if (typeof window.StartApp.showAd === 'function') {
                window.StartApp.showAd('banner', containerId);
              }
            } else if (window.startAppParam) {
              if (typeof window.startAppParam.showBanner === 'function') {
                window.startAppParam.showBanner(containerId);
              } else if (typeof window.startAppParam.showAd === 'function') {
                window.startAppParam.showAd(containerId);
              }
            }
          } catch (err) {
            console.warn('[Start.io] Ad display error:', err);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fetchAndDisplayStartAppAd);
        } else {
          fetchAndDisplayStartAppAd();
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
